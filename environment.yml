# Conda environment for the Atari Pong A2C agent.
#
#     conda env create -f environment.yml
#     conda activate atari-rl-agent
name: atari-rl-agent
dependencies:
  - python=3.12.*
  - pip
  - pip:
      - torch==2.9.1
      - numpy
      - gymnasium
      - ale_py
      - tqdm
      - matplotlib
      - moviepy
